services:
  - type: web
    name: sultanahmet-multiplayer
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE_MODE
        value: memory
      - key: ALLOWED_ORIGINS
        value: https://istanbuloyun.netlify.app,https://istanbulgame.netlify.app
      - key: PVP_ALLOWED
        value: "1"
